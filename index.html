window.VO=(function(){
 var D=[["lib_welcome", "ברוכים הבאים לספרייה! געו באות, ותשמעו איך קוראים לה."], ["lib_win_words", "כל הכבוד! המילים מסודרות לפי האלף-בית, וקיבלתם אבק כוכבים!"], ["lib_win_abc", "כל הכבוד! כל האותיות חזרו למקום שלהן, וקיבלתם אבק כוכבים!"], ["lib_prep_done", "מדהים! שמעתם את כל האותיות בספרייה, וקיבלתם אבק כוכבים! בסיבוב הבא, האותיות יראו לכם תמונות חדשות."], ["lib_words", "סדרו את המילים לפי סדר האלף-בית: מהאות אָלֶף, ועד האות תָּו."],["story_00_intro", "ששש... בואו, ילדים, תתקרבו קצת. יש לי כאן ספר עתיק וקסום. אומרים שאף אחד לא פתח אותו כבר מאה שנים! ובתוך הדפים שלו מסתתר סוד... סוד על ארץ רחוקה שנמצאת גבוה־גבוה מעל העננים, במקום שאף אדם כמעט לא ראה. ושם... גרים דרקונים! רוצים לפתוח את הספר ולגלות מה מסתתר בתוכו?"], ["story_01", "תראו! אתם רואים את השפירית המוזהבת? זאת לא שפירית רגילה. זאת שפירית קסומה שישנה בתוך הספר כבר המון־המון שנים. אבל רגע... הכנפיים שלה זזות! היא מתעוררת! רק השפירית יודעת איפה נמצא השביל הסודי שמוביל אל ארץ הדרקונים. געו בעדינות בכנפיים הנוצצות שלה..."], ["story_01_fly", "ומתחילים לעלות! למעלה... מעל ההרים... מעל העננים... אל ארץ הדרקונים!"], ["story_02", "ברוכים הבאים לארץ שמעל העננים! כאן גרה זהרית, הדרקונית המוזהבת. לזהרית יש להבה מיוחדת. כשהיא נושפת אש, האור שלה מגיע רחוק־רחוק. בזכות האור שלה השמש זורחת, הפרחים פורחים והעולם מתמלא בצבעים. אבל יש משהו שזהרית אוהבת אפילו יותר מכל האור והזהב שבעולם. על ההר הגבוה ביותר נמצא הקן שלה. ובתוכו היא שומרת על האוצר הכי יקר לה... הביצים הזוהרות שלה."], ["story_03", "אבל לא כולם אהבו את האור של זהרית. רחוק מארץ הדרקונים, במקום קר ואפור שנקרא ארץ הערפל, גר מלך הערפל. מלך הערפל אהב חושך ושקט. הוא לא אהב צבעים. הוא לא אהב את אור השמש. והדבר שהרגיז אותו יותר מכל היה לשמוע צחוק ושמחה. בכל פעם שהדרקונים צחקו ושיחקו, הוא היה מכווץ את פניו ואומר: די כבר עם כל השמחה הזאת! ויום אחד הוא החליט לעשות משהו כדי שהאור ייעלם."], ["story_04", "עמוק בתוך המערה שלו היה למלך הערפל חלון קסום. דרך החלון הוא יכול היה לראות את ארץ הדרקונים. הוא ראה את ההרים המוזהבים. את הדרקונים שעפים בשמיים. ואת זהרית שומרת על הביצים שלה. שוב הכול מואר! הוא רטן. שוב כולם שמחים! ואז... הוא הביט בביצים הזוהרות שבקן. ופתאום עלה במוחו רעיון ערמומי מאוד."], ["story_05", "באותו לילה, כשכל ארץ הדרקונים ישנה, מלך הערפל התגנב אל ההר. לאט... בשקט... עד שהגיע לקן של זהרית. היא ישנה ולא שמעה דבר. מלך הערפל הרים את ידיו ולחש לחש קסום. פתאום הופיע ענן גדול של ערפל אפור. הערפל הסתובב סביב הקן... והביצים התחילו לזוז! אחת אחרי השנייה הן החליקו החוצה, התגלגלו במורד ההר... ונפלו דרך העננים! מטה... ומטה... ומטה... כמו כוכבים נוצצים שנופלים מהשמיים."], ["story_06", "בבוקר זהרית התעוררה. היא הסתכלה בקן... וקפאה במקום. הקן היה ריק! הביצים שלי! היא פרשה מיד את כנפיה ועפה לחפש אותן. היא חיפשה בין ההרים. היא חיפשה מעל היערות. היא חיפשה בתוך העננים. יום עבר... ועוד יום... אבל היא לא מצאה אפילו ביצה אחת."], ["story_07", "זהרית נעשתה עצובה מאוד. וכל יום שעבר בלי הביצים שלה גרם למשהו מוזר לקרות. הלהבה המוזהבת שלה נעשתה קטנה יותר. האור שעל הקשקשים שלה התחיל להיעלם. וגם בארץ הדרקונים הכול התחיל להשתנות. הפרחים סגרו את עלי הכותרת. העצים איבדו את הברק שלהם. והשמיים נעשו אפורים יותר ויותר. ארץ הדרקונים הייתה זקוקה לאור של זהרית. אבל בלי הביצים שלה... האור הלך ונחלש."], ["story_08", "זהרית הייתה עצובה, אבל היא לא ויתרה. אני אמצא את הביצים שלי, היא אמרה. הייתה רק בעיה אחת. הביצים נפלו אל העולמות שמתחת לעננים, ודרקונים לא יכלו לעבור דרך הערפל הקסום שהקיף אותם. זהרית חשבה וחשבה... ואז עלה לה רעיון. אולי מישהו שם למטה יוכל לעזור לי! היא לקחה פיסת נייר וכתבה עליה מכתב. אחר כך הכניסה אותו לבקבוק זכוכית קטן. ולפני שסגרה אותו, היא נשפה לתוכו טיפת אור מהלהבה המוזהבת שלה. הבקבוק התחיל לזהור. זהרית ניגשה לקצה הענן... ושחררה אותו. הבקבוק נפל מטה אל העולם שמתחת לעננים. וכל מה שנותר לזהרית לעשות היה לקוות... שמישהו אמיץ ימצא אותו."], ["story_09", "באותו הזמן, הרחק משם, טייל ילד בן שש בשם ליאור ליד הים. ליאור היה ילד סקרן שאהב לגלות דברים חדשים. פתאום הוא עצר. מה זה? בשמיים הופיע אור זהוב. הוא ירד במהירות... והתקרב אל הים! ליאור רץ לאורך החוף בעקבות האור. בין הגלים הוא ראה משהו נוצץ. בקבוק זכוכית! ובתוכו... מכתב. ליאור הרים את הבקבוק ופתח בזהירות את הפקק. ברגע שהפקק נפתח... פוּוּוּש! אור זהוב פרץ מתוך הבקבוק והסתובב סביבו כמו אלף כוכבים קטנים."], ["story_10", "ליאור ידע בדיוק מה לעשות. הוא רץ אל המטוס הכתום שלו, מספר שבע, וטיפס במדרגות. ליאור הביט במכתב. היו עליו מילים מסתוריות... ובראש הדף היה מצויר דרקון מוזהב. ליאור עדיין לא ידע מי שלח את המכתב. הוא לא ידע מה קרה לביצים. והוא בוודאי לא ידע שמישהו מארץ הערפל כבר הרגיש שהבקבוק נפתח... אבל דבר אחד היה בטוח: ההרפתקה הגדולה ביותר של ליאור בדיוק התחילה. והמנוע... התעורר!"], ["bottle_call", "המכתב כתוב בשפת המבוגרים! קראו למבוגר שגר איתכם, שיעזור לכם לפתוח אותו."], ["letter_body", "לכל מי שמוצא את המכתב הזה: הביצים שלי נפלו לעולמות שלמטה, ואני לא יכולה לרדת אליהן. אתם מכירים את העולמות האלה. תעזרו לי למצוא אותן? בכל פעם שתפתרו חידה, הביצה תתחמם עוד קצת. אם אתם מוכנים לצאת למסע להצלת הדרקונים הקטנים שלי, געו במכתב, ונצא לדרך! שלכם, זהרית."], ["map_arrive_num", "כוכב המספרים! געו שוב באי כדי להיכנס."], ["map_arrive_heb", "אי העברית! געו שוב באי כדי להיכנס."], ["map_arrive_eng", "שונית האנגלית! געו שוב באי כדי להיכנס."], ["map_not_ready", "האי הזה עוד מתכונן לביקור שלכם. בינתיים, בואו לאי העברית!"], ["isle_welcome", "ברוכים הבאים לאי העברית! געו בפנסים הזוהרים כדי להתחיל."], ["isle_owl", "שלום! אני הינשוף החכם. בכל מקום שזוהר על האי מחכה משחק. געו בפנסים, ונתחיל!"], ["isle_soon", "המשחק הזה עוד מתכונן. בינתיים, בואו נדליק את הפנסים!"], ["ff_night", "הלילה ירד, והפנסים כבו! געו בפנס, ונחזיר אליו את הגחליליות."], ["ff_pick", "בחרו עוד פנס כבוי, ונדליק אותו!"], ["ff_lit", "הפנס הזה כבר דולק. בחרו פנס כבוי!"], ["ff_listen", "הקשיבו טוב, וגעו בגחלילית הנכונה."], ["ff_done", "כל הכבוד! הפנס נדלק, וקיבלתם אבק כוכבים! בחרו את הפנס הבא."], ["ff_all", "מדהים! הדלקתם את כל הפנסים, והאי כולו מאיר! הביצה התחממה עוד קצת."], ["lib_welcome", "בְּרוּכִים הַבָּאִים לַסִּפְרִיָּה! גְּעוּ בְּאוֹת, וְתִשְׁמְעוּ אֵיךְ קוֹרְאִים לָהּ."], ["lib_tap", "גְּעוּ בְּאוֹת, וְתִשְׁמְעוּ אֵיךְ קוֹרְאִים לָהּ."], ["lib_look", "הִסְתַּכְּלוּ טוֹב עַל הָאוֹתִיּוֹת. כָּל אוֹת יוֹשֶׁבֶת בַּמָּקוֹם שֶׁלָּהּ."], ["lib_mixed", "אוֹי! רוּחַ קֶסֶם עִרְבְּבָה חֵלֶק מֵהָאוֹתִיּוֹת! מִצְאוּ אוֹתָן, וְהַחְזִירוּ כָּל אַחַת לַמָּקוֹם שֶׁלָּהּ."], ["lib_win_abc", "כָּל הַכָּבוֹד! כָּל הָאוֹתִיּוֹת חָזְרוּ לַמָּקוֹם שֶׁלָּהֶן, וְקִבַּלְתֶּם אֲבַק כּוֹכָבִים!"], ["lib_prep_done", "מַדְהִים! שְׁמַעְתֶּם אֶת כָּל הָאוֹתִיּוֹת בַּסִּפְרִיָּה, וְקִבַּלְתֶּם אֲבַק כּוֹכָבִים! בַּסִּבּוּב הַבָּא, הָאוֹתִיּוֹת יַרְאוּ לָכֶם תְּמוּנוֹת חֲדָשׁוֹת."], ["lib_words", "סַדְּרוּ אֶת הַמִּלִּים לְפִי סֵדֶר הָאָלֶף-בֵּית: מֵהָאוֹת אָלֶף, וְעַד הָאוֹת תָּו."], ["lib_win_words", "כָּל הַכָּבוֹד! הַמִּלִּים מְסֻדָּרוֹת לְפִי הָאָלֶף-בֵּית, וְקִבַּלְתֶּם אֲבַק כּוֹכָבִים!"], ["letter_00", "אָלֶף"], ["letter_01", "בֵּית"], ["letter_02", "גִּימֶל"], ["letter_03", "דָּלֶת"], ["letter_04", "הֵא"], ["letter_05", "וָו"], ["letter_06", "זַיִן"], ["letter_07", "חֵית"], ["letter_08", "טֵית"], ["letter_09", "יוּד"], ["letter_10", "כָּף"], ["letter_11", "לָמֶד"], ["letter_12", "מֵם"], ["letter_13", "נוּן"], ["letter_14", "סָמֶךְ"], ["letter_15", "עַיִן"], ["letter_16", "פֵּא"], ["letter_17", "צָדִי"], ["letter_18", "קוּף"], ["letter_19", "רֵישׁ"], ["letter_20", "שִׁין"], ["letter_21", "תָּו"], ["word_00_0", "אַרְיֵה"], ["word_00_1", "אוֹטוֹבּוּס"], ["word_00_2", "אֲנָנָס"], ["word_00_3", "אַרְנָב"], ["word_00_4", "אוֹפַנַּיִם"], ["word_01_0", "בַּיִת"], ["word_01_1", "בָּנָנָה"], ["word_01_2", "בַּרְוָז"], ["word_01_3", "בָּלוֹן"], ["word_01_4", "בֻּבָּה"], ["word_02_0", "גֶּזֶר"], ["word_02_1", "גָּמָל"], ["word_02_2", "גְּלִידָה"], ["word_02_3", "גִּיטָרָה"], ["word_02_4", "גֶּשֶׁר"], ["word_03_0", "דָּג"], ["word_03_1", "דְּבוֹרָה"], ["word_03_2", "דֻּבִּי"], ["word_03_3", "דֶּלֶת"], ["word_03_4", "דִּינוֹזָאוּר"], ["word_04_0", "הַר"], ["word_04_1", "הִיפּוֹפּוֹטָם"], ["word_04_2", "הֶלִיקוֹפְּטֶר"], ["word_04_3", "הַמְבּוּרְגֶּר"], ["word_04_4", "הֶגֶה"], ["word_05_0", "וֶרֶד"], ["word_05_1", "וִילוֹן"], ["word_05_2", "וַפֶל"], ["word_05_3", "וָאן"], ["word_05_4", "וָו"], ["word_06_0", "זֶבְּרָה"], ["wo
