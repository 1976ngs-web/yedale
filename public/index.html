מוֹסִיפָה קֶרֶשׁ לַגֶּשֶׁר."],["br_intro_b", "קִרְאוּ אֶת הַמִּשְׁפָּט, וְלַחֲצוּ עַל הַקֶּרֶשׁ עִם הַמִּלָּה שֶׁחֲסֵרָה בּוֹ. כָּל תְּשׁוּבָה נְכוֹנָה מוֹסִיפָה קֶרֶשׁ לַגֶּשֶׁר."],["br_win2", "כָּל הַכָּבוֹד! תִּקַּנְתֶּם אֶת הַגֶּשֶׁר, וְקִבַּלְתֶּם אֲבַק כּוֹכָבִים!"],["br_s01", "הַחָתוּל שׁוֹתֶה חָלָב."],["br_s02", "הַדָּג שׂוֹחֶה בַּמַּיִם."],["br_s03", "הַצִּפּוֹר עָפָה בַּשָּׁמַיִם."],["br_s04", "אֲנִי אוֹכֵל תַּפּוּחַ אָדֹם."],["br_s05", "בַּלַּיְלָה אֲנִי יָשֵׁן בַּמִּטָּה."],["br_s06", "הַשֶּׁמֶשׁ זוֹרַחַת בַּבֹּקֶר."],["br_s07", "אַבָּא קוֹרֵא סֵפֶר."],["br_s08", "הַיֶּלֶד בּוֹעֵט בַּכַּדּוּר."],["br_s09", "בַּחֹרֶף יוֹרֵד גֶּשֶׁם."],["br_s10", "הַקּוֹף אוֹכֵל בָּנָנָה."],["br_s11", "אִמָּא שׁוֹתָה קָפֶה חַם."],["br_s12", "אֲנִי שׁוֹטֵף אֶת הַיָּדַיִם בְּסַבּוֹן."],["br_s13", "הַתַּרְנְגֹלֶת מְטִילָה בֵּיצָה."],["br_s14", "בַּלַּיְלָה רוֹאִים אֶת הַיָּרֵחַ."],["br_s15", "אֲנִי כּוֹתֵב בְּעִפָּרוֹן."],["br_s16", "הַדְּבוֹרָה עָפָה אֶל הַפֶּרַח."],["br_s17", "בַּקַּיִץ הוֹלְכִים לַיָּם."],["br_s18", "הַסּוּס רָץ מַהֵר."],["br_s19", "אֲנִי לוֹבֵשׁ מְעִיל כִּי קַר."],["br_s20", "הַתִּינוֹק בּוֹכֶה כִּי הוּא רָעֵב."],["br_s21", "אֲנַחְנוּ מְשַׂחֲקִים בַּגִּנָּה."],["br_s22", "הַפִּיל גָּדוֹל מְאוֹד."],["br_s23", "סַבְתָּא אוֹפָה עוּגָה."],["br_s24", "הַכַּדּוּר עָגֹל."],["syl_20", "סִי"], ["syl_21", "פִּי"], ["syl_22", "גִּי"], ["syl_23", "כִּי"], ["cave_welcome", "ברוכים הבאים למערת הקריסטלים!"], ["cave_intro_prep", "החיריק הוא נקודה קטנה מתחת לאות. איפה החיריק? לחצו על האות עם החיריק, וכל חיריק ידליק קריסטל במערה."], ["cave_intro_a", "הקשיבו טוב, ולחצו על הקריסטל עם ההברה הנכונה. כל תשובה נכונה מדליקה קריסטל במערה."], ["cave_intro_b", "קראו את המילה בעצמכם, ולחצו על הקריסטל עם התמונה המתאימה. כל תשובה נכונה מדליקה קריסטל במערה."], ["cave_win", "כל הכבוד! הדלקתם את כל הקריסטלים, והמערה כולה מוארת!"], ["lib_welcome", "ברוכים הבאים לספרייה! געו באות, ותשמעו איך קוראים לה."], ["lib_win_words", "כל הכבוד! המילים מסודרות לפי האלף-בית, וקיבלתם אבק כוכבים!"], ["lib_win_abc", "כל הכבוד! כל האותיות חזרו למקום שלהן, וקיבלתם אבק כוכבים!"], ["lib_prep_done", "מדהים! שמעתם את כל האותיות בספרייה, וקיבלתם אבק כוכבים! בסיבוב הבא, האותיות יראו לכם תמונות חדשות."], ["lib_words", "סדרו את המילים לפי סדר האלף-בית: מהאות אָלֶף, ועד האות תָּו."],["story_00_intro", "ששש... בואו, ילדים, תתקרבו קצת. יש לי כאן ספר עתיק וקסום. אומרים שאף אחד לא פתח אותו כבר מאה שנים! ובתוך הדפים שלו מסתתר סוד... סוד על ארץ רחוקה שנמצאת גבוה־גבוה מעל העננים, במקום שאף אדם כמעט לא ראה. ושם... גרים דרקונים! רוצים לפתוח את הספר ולגלות מה מסתתר בתוכו?"], ["story_01", "תראו! אתם רואים את השפירית המוזהבת? זאת לא שפירית רגילה. זאת שפירית קסומה שישנה בתוך הספר כבר המון־המון שנים. אבל רגע... הכנפיים שלה זזות! היא מתעוררת! רק השפירית יודעת איפה נמצא השביל הסודי שמוביל אל ארץ הדרקונים. געו בעדינות בכנפיים הנוצצות שלה..."], ["story_01_fly", "ומתחילים לעלות! למעלה... מעל ההרים... מעל העננים... אל ארץ הדרקונים!"], ["story_02", "ברוכים הבאים לארץ שמעל העננים! כאן גרה זהרית, הדרקונית המוזהבת. לזהרית יש להבה מיוחדת. כשהיא נושפת אש, האור שלה מגיע רחוק־רחוק. בזכות האור שלה השמש זורחת, הפרחים פורחים והעולם מתמלא בצבעים. אבל יש משהו שזהרית אוהבת אפילו יותר מכל האור והזהב שבעולם. על ההר הגבוה ביותר נמצא הקן שלה. ובתוכו היא שומרת על האוצר הכי יקר לה... הביצים הזוהרות שלה."], ["story_03", "אבל לא כולם אהבו את האור של זהרית. רחוק מארץ הדרקונים, במקום קר ואפור שנקרא ארץ הערפל, גר מלך הערפל. מלך הערפל אהב חושך ושקט. הוא לא אהב צבעים. הוא לא אהב את אור השמש. והדבר שהרגיז אותו יותר מכל היה לשמוע צחוק ושמחה. בכל פעם שהדרקונים צחקו ושיחקו, הוא היה מכווץ את פניו ואומר: די כבר עם כל השמחה הזאת! ויום אחד הוא החליט לעשות משהו כדי שהאור ייעלם."], ["story_04", "עמוק בתוך המערה שלו היה למלך הערפל חלון קסום. דרך החלון הוא יכול היה לראות את ארץ הדרקונים. הוא ראה את ההרים המוזהבים. את הדרקונים שעפים בשמיים. ואת זהרית שומרת על הביצים שלה. שוב הכול מואר! הוא רטן. שוב כולם שמחים! ואז... הוא הביט בביצים הזוהרות שבקן. ופתאום עלה במוחו רעיון ערמומי מאוד."], ["story_05", "באותו לילה, כשכל ארץ הדרקונים ישנה, מלך הערפל התגנב אל ההר. לאט... בשקט... עד שהגיע לקן של זהרית. היא ישנה ולא שמעה דבר. מלך הערפל הרים את ידיו ולחש לחש קסום. פתאום הופיע ענן גדול של ערפל אפור. הערפל הסתובב סביב הקן... והביצים התחילו לזוז! אחת אחרי השנייה הן החליקו החוצה, התגלגלו במורד ההר... ונפלו דרך העננים! מטה... ומטה... ומטה... כמו כוכבים נוצצים שנופלים מהשמיים."], ["story_06", "בבוקר זהרית התעוררה. היא הסתכלה בקן... וקפאה במקום. הקן היה ריק! הביצים שלי! היא פרשה מיד את כנפיה ועפה לחפש אותן. היא חיפשה בין ההרים. היא חיפשה מעל היערות. היא חיפשה בתוך העננים. יום עבר... ועוד יום... אבל היא לא מצאה אפילו ביצה אחת."], ["story_07", "זהרית נעשתה עצובה מאוד. וכל יום שעבר בלי הביצים שלה גרם למשהו מוזר לקרות. הלהבה המוזהבת שלה נעשתה קטנה יותר. האור שעל הקשקשים שלה התחיל להיעלם. וגם בארץ הדרקונים הכול התחיל להשתנות. הפרחים סגרו את עלי הכותרת. העצים איבדו את הברק שלהם. והשמיים נעשו אפורים יותר ויותר. ארץ הדרקונים הייתה זקוקה לאור של זהרית. אבל בלי הביצים שלה... האור הלך ונחלש."], ["story_08", "זהרית הייתה עצובה, אבל היא לא ויתרה. אני אמצא את הביצים שלי, היא אמרה. הייתה רק בעיה אחת. הביצים נפלו אל העולמות שמתחת לעננים, ודרקונים לא יכלו לעבור דרך הערפל הקסום שהקיף אותם. זהרית חשבה וחשבה... ואז עלה לה רעיון. אולי מישהו שם למטה יוכל לעזור לי! היא לקחה פיסת נייר וכתבה עליה מכתב. אחר כך הכניסה אותו לבקבוק זכוכית קטן. ולפני שסגרה אותו, היא נשפה לתוכו טיפת אור מהלהבה המוזהבת שלה. הבקבוק התחיל לזהור. זהרית ניגשה לקצה הענן... ושחררה אותו. הבקבוק נפל מטה אל העולם שמתחת לעננים. וכל מה שנותר לזהרית לעשות היה לקוות... שמישהו אמיץ ימצא אותו."], ["story_09", "באותו הזמן, הרחק משם, טייל ילד בן שש בשם ליאור ליד הים. ליאור היה ילד סקרן שאהב לגלות דברים חדשים. פתאום הוא עצר. מה זה? בשמיים הופיע אור זהוב. הוא ירד במהירות... והתקרב אל הים! ליאור רץ לאורך החוף בעקבות האור. בין הגלים הוא ראה משהו נוצץ. בקבוק זכוכית! ובתוכו... מכתב. ליאור הרים את הבקבוק ופתח בזהירות את הפקק. ברגע שהפקק נפתח... פוּוּוּש! אור זהוב פרץ מתוך הבקבוק והסתובב סביבו כמו אלף כוכבים קטנים."], ["story_10", "ליאור ידע בדיוק מה לעשות. הוא רץ אל המטוס הכתום שלו, מספר שבע, וטיפס במדרגות. ליאור הביט במכתב. היו עליו מילים מסתוריות... ובראש הדף היה מצויר דרקון מוזהב. ליאור עדיין לא ידע מי שלח את המכתב. הוא לא ידע מה קרה לביצים. והוא בוודאי לא ידע שמישהו מארץ הערפל כבר הרגיש שהבקבוק נפתח... אבל דבר אחד היה בטוח: ההרפתקה הגדולה ביותר של ליאור בדיוק התחילה. והמנוע... התעורר!"], ["bottle_call", "המכתב כתוב בשפת המבוגרים! קראו למבוגר שגר איתכם, שיעזור לכם לפתוח אותו."], ["letter_body", "לכל מי שמוצא את המכתב הזה: הביצים שלי נפלו לעולמות שלמטה, ואני לא יכולה לרדת אליהן. אתם מכירים את העולמות האלה. תעזרו לי למצוא אותן? בכל פעם שתפתרו חידה, הביצה תתחמם עוד קצת. אם אתם מוכנים לצאת למסע להצלת הדרקונים הקטנים שלי, געו במכתב, ונצא לדרך! שלכם, זהרית."], ["map_arrive_num", "כוכב המספרים! געו שוב באי כדי להיכנס."], ["map_arrive_heb", "אי העברית! געו שוב באי כדי להיכנס."], ["map_arrive_eng", "שונית האנגלית! געו שוב באי כדי להיכנס."], ["map_not_ready", "האי הזה עוד מתכונן לביקור שלכם. בינתיים, בואו לאי העברית!"], ["isle_welcome", "ברוכים הבאים לאי העברית! געו בפנסים הזוהרים כדי להתחיל."], ["isle_owl", "שלום! אני הינשוף החכם. בכל מקום שזוהר על האי מחכה משחק. געו בפנסים, ונתחיל!"], ["isle_soon", "המשחק הזה עוד מתכונן. בינתיים, בואו נדליק את הפנסים!"], ["ff_night", "הלילה ירד, והפנסים כבו! געו בפנס, ונחזיר אליו את הגחליליות."], ["ff_pick", "בחרו עוד פנס כבוי, ונדליק אותו!"], ["ff_lit", "הפנס הזה כבר דולק. בחרו פנס כבוי!"], ["ff_listen", "הקשיבו טוב, וגעו בגחלילית הנכונה."], ["ff_done", "כל הכבוד! הפנס נדלק, וקיבלתם אבק כוכבים! בחרו את הפנס הבא."], ["ff_all", "מדהים! הדלקתם את כל הפנסים, והאי כולו מאיר! הביצה התחממה עוד קצת."], ["lib_welcome", "בְּרוּכִים הַבָּאִים לַסִּפְרִיָּה! גְּעוּ בְּאוֹת, וְתִשְׁמְעוּ אֵיךְ קוֹרְאִים לָהּ."], ["lib_tap", "גְּעוּ בְּאוֹת, וְתִשְׁמְעוּ אֵיךְ קוֹרְאִים לָהּ."], ["lib_look", "הִסְתַּכְּלוּ טוֹב עַל הָאוֹתִיּוֹת. כָּל אוֹת יוֹשֶׁבֶת בַּמָּקוֹם שֶׁלָּהּ."], ["lib_mixed", "אוֹי! רוּחַ קֶסֶם עִרְבְּבָה חֵלֶק מֵהָאוֹתִיּוֹת! מִצְאוּ אוֹתָן, וְהַחְזִירוּ כָּל אַחַת לַמָּקוֹם שֶׁלָּהּ."], ["lib_win_abc", "כָּל הַכָּבוֹד!
